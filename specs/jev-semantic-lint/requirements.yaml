    kind: functional
    given: "TYPESAFE_API_KEYが設定され、TYPESAFE_BASE_URLがリクエストを記録するローカルのモックサーバーを指す環境で"
    when: "`npx tsx scripts/spec-lint.ts <dir>` を `--semantic` なしで実行する"
    then: "モックサーバーが受信したリクエストは0件になる。出力にSEMANTIC_で始まるコードを含まない"
    priority: must
    verify: test
    status: pending
    attempts: 0
  - id: AC-063
    kind: functional
    given: "モックサーバーがあるACのthenに対してnoul 0.2を返す環境で"
    when: "`npx tsx scripts/spec-lint.ts <dir> --semantic` を実行する"
    then: "そのAC-IDをrefとするwarn SEMANTIC_UNOBSERVABLE_THENを出力し、メッセージに 0.20 を含む"
    priority: must
    verify: test
    status: pending
    attempts: 0
