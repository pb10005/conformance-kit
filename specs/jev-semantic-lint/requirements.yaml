# FEAT-009 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-009
title: "spec-lintにJevによるopt-inの意味チェック（warn専用）を追加する"
status: draft # draft -> (spec-lint --gate freeze) -> frozen

# 誰のどの困りごとを解くのか。1文。実装判断に迷った時の最終的な拠り所になる。
intent: "conformance-kitのメンテナ・利用者が、spec-lint.tsのUNOBSERVABLE_THEN（観測動詞の辞書一致）では拾えない\
  『観測できない then』（英語の要件、辞書にない言い回し）と、辞書に一致するだけで観測できる then を誤って指摘する誤検知を、\
  TypeSafe AIのJev（@typesafe-ai/sdk）による意味判定で補えるかを試せるようにする。2026-09-24のTREND_BACKLOG.mdの判断\
  （adopt: gateに組み込まないopt-inの補助警告として試行）を実装するもので、既定の動作・gate・CIの決定性は一切変えない。\
  試行の結果は、TREND_BACKLOGの再検討条件（改善が実測できなければ取り下げ）の判断材料にする。"

# 過剰実装を止める外周。draft を抜けるには最低1件必要。
# 「やらないと決めたこと」であって「将来やること」ではない。
out_of_scope:
  - "gate.ts・.github/workflows/conformance.ymlからの意味チェックの呼び出し。gate（必須チェック）への昇格はTREND_BACKLOGの再検討条件\
    （SLA公開と日本語要件での判定精度の実測）を満たした後に別specで扱う"
  - "CIへのTYPESAFE_API_KEYシークレットの登録・参照"
  - "then の観測可能性以外の意味チェック（曖昧語・異常系の有無・複合then・非機能要件の数値の判定）"
  - "既存の正規表現ベースの検査（AMBIGUOUS_TERM・UNOBSERVABLE_THENを含む全検査コード）の判定条件・level・重みの変更、および意味チェックの結果による既存findingの抑制"
  - "判定精度（誤検知率・見逃し率）を自動で集計・評価する仕組み。試行結果の評価は人間が行う"
  - "しきい値・モデル・問い文をconformance.config.jsonやCLI引数で変更できるようにすること"
  - "Jev以外のモデル・プロバイダ（OpenRouter・Vercel/Netlify AI Gatewayを含む）経由での呼び出し"
  - "install.mjsによる@typesafe-ai/sdkの自動インストール、および導入先package.jsonへの依存追加"
  - "判定結果のキャッシュ・永続化"

# 確信が持てないまま進める判断。コード側に @assumption AS-XXX を残して回収可能にする。
# owner と resolve_by が無い仮決めは、誰も確定させないまま本番に入る。
assumptions:
  - id: AS-035
    statement: "意味チェックは spec-lint.ts に `--semantic` フラグを明示した時だけ動く。TYPESAFE_API_KEYが環境にあるだけでは動かない\
      （キーが入った環境で要件テキストが暗黙に外部送信されるのを防ぐ）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-036
    statement: "判定対象はthenの観測可能性だけとする。status: draft以外を含む全specのACごとに1リクエスト、stateはthenの文字列のみ、\
      問いはnoul（yes/no確率）1問『このthenは外部から観測できる結果（返す値・出力・保存内容・拒否のいずれか）を述べているか』とする"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-037
    statement: "noulの値が0.5未満のACについて、warn SEMANTIC_UNOBSERVABLE_THEN を出力する。メッセージにはnoulの値を小数2桁で含める。\
      しきい値0.5は試行用の仮値で、変更は本specの再reconcileで行う"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-038
    statement: "モデルは jev-latest ではなく jev-1.13.0 に固定する（TREND_BACKLOG: 公開された弱点リストと実際に呼ぶモデルを一致させるため）。\
      タイムアウトは1リクエスト10000ミリ秒、SDKの自動リトライは0回とする"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-039
    statement: "@typesafe-ai/sdkはキット自身のpackage.jsonのdevDependenciesに入れる（テストと型のため）。spec-lint.tsと配布されるscripts/は\
      SDKを静的importせず、`--semantic` 指定時にだけ動的importする。SDKが未インストールの導入先でも、spec-lint.tsの通常実行とtsc --noEmitは\
      影響を受けない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-040
    statement: "意味チェックが実行できない場合（キー未設定・SDK未インストール・HTTPエラー・タイムアウト）は、warn SEMANTIC_SKIPPEDを出力して\
      残りの検査を続行する。意味チェックに起因してexit codeが変わることはない（0/1は既存の検査結果だけで決まり、2にもならない）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"

# 人間の判断が要る未決事項。frozen にするには空にする（確定させるか assumptions へ降格）。
open_questions: []

# 受入基準。ハッピーパスだけ書くと必ず後で破綻するので、異常系を必ず1件以上入れる。
# then には外から観測できる結果を書く（返す/表示/保存/拒否…）。「対応する」「できる」は不可。
acceptance:
