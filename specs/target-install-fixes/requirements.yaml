# FEAT-010 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-010
title: "導入先への配布物を修正する（ankb導入フィードバック）"
status: frozen # draft -> (spec-lint --gate freeze) -> frozen

# 誰のどの困りごとを解くのか。1文。実装判断に迷った時の最終的な拠り所になる。
intent: "conformance-kitを外部リポジトリ（ankb）へ導入した利用者が、導入直後に手作業で直す必要があった3点を、キット側で解消する。\
  (1)
  install.mjsがキット自身の開発用ファイル（CIのsamples-selfcheck/windows-selfcheckジョブ、/trend-wa\
  tchコマンド、record-trend.ts）まで配置する。(2)
  配置されるCI定義のブランチがmaster、conformance.config.jsonのbaseRefがorigin/masterに固定されており、m\
  ainをデフォルトブランチとするリポジトリでは逆方向トレースとCIのpushトリガーが機能しない。(3)
  spec-lintが「冪」「べき」の直後のU+7B49を曖昧語（U+7B49、漢字1字の「とう」）として誤検出し、利用者が「idempotent」と書き換\
  えて回避している。"

# 過剰実装を止める外周。draft を抜けるには最低1件必要。
# 「やらないと決めたこと」であって「将来やること」ではない。
out_of_scope:
  - "キット自身のリポジトリの.github/workflows/conformance.yml・conformance.config.jsonのブランチ\
    設定の変更（キット自身のデフォルトブランチはmasterのまま）"
  - "導入済みリポジトリに過去の実行で配置されたキット専用ファイル（record-trend.ts・trend-watch.md・既存のconforman\
    ce.yml）の削除・書き換え・移行"
  - "曖昧語辞書のU+7B49以外の語の判定条件の変更、および辞書の外部設定化"
  - "GitHub Actions以外のCIプロバイダ向けの定義の配布"
  - "導入先のデフォルトブランチをGitHub APIを含むネットワーク経由で問い合わせること（ローカルのgit情報だけで判定する）"
  - "対象がgitリポジトリのサブディレクトリ（モノレポ）の場合に、親リポジトリとは別のデフォルトブランチを判定すること（親リポジトリのorigin/HE\
    ADをそのまま使う）"
  - "install.mjsの既存の上書き方針（.claude/とscripts/は常に更新、それ以外の既存ファイルは上書きしない）の変更。既存ファイルと\
    検出したブランチの不一致は警告するだけで書き換えない"

# 確信が持てないまま進める判断。コード側に @assumption AS-XXX を残して回収可能にする。
# owner と resolve_by が無い仮決めは、誰も確定させないまま本番に入る。
assumptions:
  - id: AS-042
    statement: "キット専用ファイルは install.mjs
      内の固定リスト（.claude/commands/trend-watch.md、scripts/record-trend.ts）で除外する。キット\
      専用ファイルを追加する時はこのリストに加える。.claude/skills/配下とscripts/lib/配下にはキット専用ファイルは現在無い"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-043
    statement: "導入先へ配るCI定義は templates/conformance.yml
      として分離し、gateジョブだけを含める。ブランチ名の箇所はプレースホルダ__DEFAULT_BRANCH__
      とし、install.mjsが置換する。templates/conformance.config.jsonはFEAT-008
      AC-058のためキット自身の設定とbaseRefを含めて一致させたまま残し、install.mjsがJSONとして読み込んでbaseRefだけを\
      origin/<ブランチ名>に書き換えて出力する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-044
    statement: "導入先のデフォルトブランチは次の順で決める: (1) `--default-branch <name>` 引数、(2) 導入先で
      `git symbolic-ref refs/remotes/origin/HEAD` が返すブランチ、(3)
      main。現在のブランチ（作業ブランチになりがち）は使わない。gitの失敗（リポジトリでない・gitがPATHに無い）は(3)へ進み、gitの標準\
      エラーは表示しない。決めた結果を `default branch: <name> (<source>)` の1行で出力する。sourceは
      --default-branch / origin/HEAD / fallback のいずれか。fallbackの時は続けて
      `--default-branch で指定できます` を1行出力する"
    status: confirmed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-045
    statement: "曖昧語U+7B49は、直前が「冪」「べき」「同」「対」「平」「均」「劣」「優」「何」、または直後が「し」「く」「さ」「価」「号」「分」\
      「級」「式」「辺」の場合にその出現だけを除外する。「上」「高」「初」は名詞＋U+7B49（例:
      「画面上」の直後）と区別できないため除外しない。判定は出現ごとに行い、同じ文中に除外される出現と除外されない出現があれば後者を検出する"
    status: confirmed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-046
    statement: "install.mjsの引数は位置に依存せずに解釈する（`--with-samples` と `--default-branch
      <name>` は順不同）。`--default-branch` の値は`[A-Za-z0-9._/-]+`
      に一致し、先頭が「-」でなく「..」を含まないものだけを受け付ける。値が無い・不正な場合は、何も書き込む前にexit 2で終了する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-09"
  - id: AS-047
    statement: "導入先に既存のconformance.config.jsonがあり、そのbaseRefが origin/<決めたブランチ名>
      と異なる場合、ファイルは書き換えずに`! 既存の conformance.config.json の baseRef (<既存値>) は既定ブランチ
      <name> と異なります` を1行出力する。既存のconformance.ymlは内容を比較しない"
    status: confirmed
    owner: pb10005
    resolve_by: "2026-10-09"

# 人間の判断が要る未決事項。frozen にするには空にする（確定させるか assumptions へ降格）。
open_questions: []

