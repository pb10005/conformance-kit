    when: "リポジトリルートで `npm run gate`（spec-lint.ts、trace-matrix.ts、npm test、npx tsc --noEmit を順に実行するもの）を実行する"
    then: "すべてのコマンドがexit code 0を返す"
    priority: must
    verify: manual
    status: pending
    attempts: 0
  - id: AC-006
