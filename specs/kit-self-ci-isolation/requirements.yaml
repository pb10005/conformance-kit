    then: "example-loginのAC-002由来のUNCOVERED_AC、AC-003由来のNO_EVIDENCE、rogue.ts由来のUNTRACED_CHANGEのfindingが出力される。exit codeは0以外になる"
    priority: should
    verify: test
    status: pending
    attempts: 0
  - id: AC-007
    kind: functional
    given: "AC-001〜AC-006の変更がmasterにマージされた後"
    when: "GitHub Actions上で `.github/workflows/conformance.yml` の gate ジョブが実行される"
    then: "gateジョブの実行結果がGitHub Actions上に成功として表示される"
