    when: "`bash install.sh <tmp-target> --with-samples` を実行する"
    then: "install.shはエラー終了（非0 exit）しない。欠落しているサンプルごとに1行の警告メッセージを標準出力に出力する。導入完了メッセージまで出力する"
    priority: should
    verify: test
    status: pending
    attempts: 0
  - id: AC-005
