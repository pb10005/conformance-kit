    then: "rogue.ts・example-login由来のfinding（UNTRACED_CHANGE・UNCOVERED_AC）が一切出力されない。NO_BASE_REF警告も出力されない。exit codeは0になる"
    priority: must
    verify: test
    status: pending
    attempts: 0
