    kind: functional
    given: "サンプル一式が examples/with-samples/ 配下に移設された状態で"
    when: "リポジトリルートで `npx tsx scripts/spec-lint.ts` を実行する"
    then: "example-login由来のID衝突（DUPLICATE_ID）・プレースホルダ（PLACEHOLDER_LEFT）が一切出力されず、exit codeが0になる"
    priority: must
    verify: test
    status: pending
    attempts: 0
  - id: AC-002
    kind: functional
    given: "サンプル一式が examples/with-samples/ 配下に移設され、AS-004のbaseRef修正が適用された状態で"
