      --jsonを実行し、docstring由来のAC-001がcoverageに出力されること（=UNCOVERED_AC非発生と等価、trace-matrix.ts:221-226のロジックによりcoverage.length>0ならUNCOVERED_ACは出ない）をAC-021のテストが直接検証。f28fa6fのisTest修正差分・CI
      run結果・job idを独立に確認し一致を確認した。
    evidence: "gh run 35314256155 (job 105502428583 windows-selfcheck, headSha f28fa6f)
