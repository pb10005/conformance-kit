      scripts/gate.tsを呼ぶ）に更新されており、Windows(PowerShell/cmd.exe)でも追加のシェル無しに動作する旨の記\
      述を含む"
    priority: should
    verify: inspection
    status: pass
    attempts: 0
    verified_at: 2026-09-16
