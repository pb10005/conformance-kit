    evidence: tests/playwright-support.test.ts:73-78 (node --test pass)
  - id: AC-034
    kind: functional
    given: "test.fail(\"AC-034: ...\", async ({ page }) => {...})
      のように、test.failで書かれた（失敗することを期待して実行される）テストが存在する状態で"
