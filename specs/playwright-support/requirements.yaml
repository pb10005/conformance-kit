# 受入基準。ハッピーパスだけ書くと必ず後で破綻するので、異常系を必ず1件以上入れる。
# then には外から観測できる結果を書く（返す/表示/保存/拒否…）。「対応する」「できる」は不可。
acceptance:
  - id: AC-029
    kind: functional
    given: "@playwright/testをimportしている.spec.tsファイルに、test.describe(\"AC-029:
      ...\", () => { test(\"...\", async ({ page }) => {...}); }) のように、describeタイトルにAC-IDを\
      含み、配下に有効(非skip)なtest()が1件以上ある状態で"
    when: "trace-matrix.tsを実行する"
    then: "AC-029についてUNCOVERED_ACは出力されず、coverage一覧にこのファイルが含まれる"
    priority: must
    verify: test
    status: pending
    attempts: 0
  - id: AC-030
    kind: functional
    given: "test.describe.skip(\"AC-030: ...\", () => { test(\"...\", ...) }) のように、\
      describe自体が.skip修飾されている状態で"
    when: "trace-matrix.tsを実行する"
    then: "配下のtest()個々にskip修飾が無くても、AC-030はSKIPPED_TESTとしてAC-ID単位で1回出力される（配下のtest()の数に\
      関わらず重複しない。record-verdict.tsの対象ACループがAC-ID単位で1回だけ判定する既存実装に合わせる）。有効なカバーとしては計上されない"
    priority: must
    verify: test
    status: pending
    attempts: 0
  - id: AC-031
    kind: functional
    given: "test.fixme(\"AC-031: ...\", async ({ page }) => {...}) のように、test.fixmeで書か\
      れたテストが存在する状態で"
    when: "trace-matrix.tsを実行する"
    then: "このタイトルはSKIPPED_TESTとして出力される（現状のように正規表現に一致せず完全に無視され、UNCOVERED_ACにすらならないのではなく）"
    priority: must
    verify: test
    status: pending
    attempts: 0
  - id: AC-032
    kind: functional
    given: "@playwright/testをimportしていない.spec.tsファイル(例: Jest/Mocha)で、describeタイトルにAC-ID\
      が書かれているが対応するit()/test()のタイトルには書かれていない状態で"
    when: "trace-matrix.tsを実行する"
    then: "従来通りdescribeタイトルはカバーとして数えられず、UNCOVERED_ACとして出力され続ける（@playwright/testを\
      importしないファイルの既存挙動に影響を与えない）"
    priority: must
    verify: test
    status: pending
    attempts: 0
  - id: AC-033
    kind: functional
    given: "test.describe(\"AC-033: ...\", () => {}) のように、AC-IDを含むdescribeタイトルの配下が空の（test()\
      を1件も持たない）状態で"
    when: "trace-matrix.tsを実行する"
    then: "AC-033はカバーとして計上されず、UNCOVERED_ACとして出力される"
    priority: should
    verify: test
    status: pending
    attempts: 0
  - id: AC-034
    kind: functional
    given: "test.fail(\"AC-034: ...\", async ({ page }) => {...}) のように、test.failで書かれた\
      （失敗することを期待して実行される）テストが存在する状態で"
    when: "trace-matrix.tsを実行する"
    then: "このタイトルは有効なカバー(activeTitles)として検出され、AC-034についてUNCOVERED_ACもSKIPPED_TESTも出力されない\
      （test.fixmeとは異なり実行はされるため）"
    priority: should
    verify: test
    status: pending
    attempts: 0
  - id: AC-035
    kind: functional
    given: "@playwright/testをimportしているファイルで、test.describe(\"AC-035: ...\", () => { test(\"AC-9\
      36: ...\", ...) }) のように、describeタイトルとtest()タイトルに異なるAC-IDがそれぞれ書かれている状態で"
    when: "trace-matrix.tsを実行する"
    then: "AC-035・AC-936の両方が独立してカバーとして計上され、どちらについてもUNCOVERED_ACは出力されない（describe側とtest()\
      側のどちらか一方を優先して他方を無視することはしない）"
    priority: should
    verify: test
    status: pending
    attempts: 0
