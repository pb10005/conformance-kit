    priority: should
    verify: test
    status: pass
    attempts: 0
    verified_at: 2026-09-18
    note: "test.fail('AC-034: ...')がisTestCallSkipped()でfalse判定されactive.has=true,
      skipped.has=falseとなることを確認。fixmeとは異なりUNCOVERED_ACにもSKIPPED_TESTにもならず有効なカバー\
      として扱われる。"
    evidence: tests/playwright-support.test.ts:80-85 (node --test pass)
  - id: AC-035
    kind: functional
    given: "@playwright/testをimportしているファイルで、test.describe(\"AC-035: ...\", () => {
      test(\"AC-936: ...\", ...) })
      のように、describeタイトルとtest()タイトルに異なるAC-IDがそれぞれ書かれている状態で"
    when: "trace-matrix.tsを実行する"
    then: "AC-035・AC-936の両方が独立してカバーとして計上され、どちらについてもUNCOVERED_ACは出力されない（describe側とte\
      st()側のどちらか一方を優先して他方を無視することはしない）"
    priority: should
    verify: test
    status: pass
    attempts: 0
    verified_at: 2026-09-18
    note: describeタイトル(AC-035)とtest()タイトル(AC-024、実在ACを流用)に異なるAC-IDを書いた入力で、両方が独立してactiveに入ることを確認(和集合、排他無し)。AS-023の要求通り。
    evidence: tests/playwright-support.test.ts:87-100 (node --test pass)
