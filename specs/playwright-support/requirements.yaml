# FEAT-006 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-006
title: "Playwright（test.describe/test）のAC-IDカバー検出をtrace-matrix.tsでサポートする"
status: frozen # draft -> (spec-lint --gate freeze) -> frozen

# 誰のどの困りごとを解くのか。1文。実装判断に迷った時の最終的な拠り所になる。
intent: "Playwright（@playwright/test）のE2Eテストは、1つのACのthenが複数のユーザー操作ステップに分かれることが多\
  く、Jest/Mochaのようにit()/test()1件=AC1件で書きにくい。実務上は test.describe(\"AC-XXX: ...\",
  () => { test(\"...\"); test(\"...\");
  })のようにdescribeでシナリオをグループ化し、配下の複数test()で1つのACをまとめてカバーする書き方が自然になる。現状のtrace-matr\
  ix.tsはit()/test()のタイトルしか見ないため、この書き方をすると実際にはテストされているACが「未カバー」と誤検出される。加えてtest.f\
  ixme()/test.describe.skip()などPlaywright固有のスキップ表現は現行のTEST_CALL_REに一致せず、スキップとして\
  すら検出されず完全に無視される（不可視化）。@playwright/testをimportしているファイルに限り、describeタイトルからのAC-ID\
  検出とPlaywright固有のスキップ表現の検出をtrace-matrix.tsに追加する。"

# 過剰実装を止める外周。draft を抜けるには最低1件必要。
# 「やらないと決めたこと」であって「将来やること」ではない。
out_of_scope:
  - "test.step()のタイトルからのAC-ID検出。粒度はtest.describe()とtest()の2階層までとし、ステップ単位は対象外とする"
  - "2階層より深いdescribeの入れ子(test.describe内にさらにtest.describeがある場合)。今回は「1つのdescribe直\
    下に複数のtest()」の形のみサポートする。2階層目以降のdescribeは無視し、その配下のtest()は従来通りtest()自身のタイトルでのみ\
    判定する(誤カバーを避けるため検出を拡張しない)"
  - "playwright.config.ts のprojects/fixture定義の検出・解析"
  - "テンプレートリテラル・変数展開を含む動的なタイトル文字列(describe/testいずれも)からのAC-ID抽出。既存のJS/TS検出と同様、静的\
    な文字列リテラルのみを対象とする"
  - "@playwright/test以外のE2Eフレームワーク(例: Cypress, WebdriverIO)への対応"
  - "test.describe.only / test.only によるテストの絞り込み実行そのものへの言及・警告(カバー判定への影響のみを扱う)"
  - "@playwright/testのサブパスからのimport(例:
    `@playwright/test/fixtures`のような別ファイルパス経由)やre-export経由の間接importの検出。AS-019の完全\
    一致パターンに一致しないファイルは、@playwright/testをimportしていないファイルと同様に扱う（describe検出は適用されず、既\
    存のit()/test()検出のみが適用される）"

# 確信が持てないまま進める判断。コード側に @assumption AS-001 を残して回収可能にする。
# owner と resolve_by が無い仮決めは、誰も確定させないまま本番に入る。
assumptions:
  - id: AS-019
    statement: "検出対象は @playwright/test をimportしている .spec.ts/.test.ts
      ファイルに限定する。判定はソース中に正規表現で `from\\s+[\"']@playwright/test[\"']`
      が存在するかどうかで行う（importの別名・`require()`記法・re-export経由の間接importは対象外とする）。この判定が無い\
      と、同じ .spec.ts
      拡張子を使う既存のJest/Mocha向けファイルでもdescribeタイトルが誤ってカバーとして数えられてしまい、CLAUDE.mdの既存規約（\
      describeは数えない）が壊れる"
    status: confirmed
    owner: pb10005
    resolve_by: "2026-09-25"
  - id: AS-020
    statement: "test.describe(\"AC-XXX: ...\", () => {...})
      のタイトルでのAC-ID検出は、直下（1階層）のtest()呼び出しが1件以上あり、かつそのうち少なくとも1件が有効(非skip)である場合にのみ\
      「カバー」とする。直下にtest()が1件も無い空のdescribeブロックはカバーとして扱わない"
    status: confirmed
    owner: pb10005
    resolve_by: "2026-09-25"
  - id: AS-021
    statement: "test.describe.skip(...) / test.describe.fixme(...)
      でラップされたブロックは、直下のtest()個々にskip修飾が無くても全てスキップ扱いにする（「直下」はAS-020と同じ1階層の意味で統一する\
      。2階層目以降のdescribeはout_of_scopeにより解析対象外のため、この伝播ルールも1階層目にのみ適用される）。逆に
      test.describe.only(...)
      は実行対象の絞り込みであってスキップではないため、カバー判定には影響を与えない（通常のdescribeと同じ扱い）"
    status: confirmed
    owner: pb10005
    resolve_by: "2026-09-25"
  - id: AS-022
    statement: "現行の TEST_CALL_RE は modifier を `(only|skip|todo|each|concurrent)`
      に限定しており、Playwright固有の `test.fixme(...)` / `test.fail(...)`
      はこの一覧に無いため、正規表現全体がマッチに失敗し完全に無視されている（activeでもskippedでもなく、UNCOVERED_ACにすらなら\
      ない不可視化のバグ）。`fixme`
      はskip相当として検出対象に追加する。`fail`（失敗することを期待して実行はする)は実行される点でskipと異なるため、今回はactive（\
      有効なカバー）として扱う"
    status: confirmed
    owner: pb10005
    resolve_by: "2026-09-25"
  - id: AS-023
    statement: "同一ファイル内でdescribeタイトルとtest()タイトルの両方にAC-IDが書かれている場合(同一IDでも別IDでも)、両方とも\
      独立してカバー判定に加える(和集合)。describe側とtest()側で優先順位や排他は設けない。これは既存のJS/TS検出(test()のみ)\
      にdescribe検出を追加する形の拡張であり、既存のtest()単位の判定に一切変更を加えないための最も単純な合成方法である"
    status: confirmed
    owner: pb10005
    resolve_by: "2026-09-25"

# 人間の判断が要る未決事項。frozen にするには空にする（確定させるか assumptions へ降格）。
