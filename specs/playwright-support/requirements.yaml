# 受入基準。ハッピーパスだけ書くと必ず後で破綻するので、異常系を必ず1件以上入れる。
# then には外から観測できる結果を書く（返す/表示/保存/拒否…）。「対応する」「できる」は不可。
acceptance:
  - id: AC-029
    kind: functional
    given: "@playwright/testをimportしている.spec.tsファイルに、test.describe(\"AC-029: ...\",
      () => { test(\"...\", async ({ page }) => {...}); })
      のように、describeタイトルにAC-IDを含み、配下に有効(非skip)なtest()が1件以上ある状態で"
    when: "trace-matrix.tsを実行する"
    then: "AC-029についてUNCOVERED_ACは出力されず、coverage一覧にこのファイルが含まれる"
    priority: must
    verify: test
    status: pass
    attempts: 0
    verified_at: 2026-09-18
    note: describeタイトルにAC-029、直下に有効なtest()1件がある入力でextractPlaywrightCoverageを実行し、active.has('AC-029')=true
      かつ skipped.size=0
      を確認。trace-matrix.tsはactiveTitlesからcoverageを構築する共通ロジック(scripts/trace-matrix.ts:216-219)を使うため、UNCOVERED_AC非出力とcoverage一覧への計上は同ロジックで担保される。
    evidence: tests/playwright-support.test.ts:26-38 (node --test pass)
  - id: AC-030
    kind: functional
    given: "test.describe.skip(\"AC-030: ...\", () => { test(\"...\", ...) })
      のように、describe自体が.skip修飾されている状態で"
    when: "trace-matrix.tsを実行する"
    then: "配下のtest()個々にskip修飾が無くても、AC-030はSKIPPED_TESTとしてAC-ID単位で1回出力される（配下のtest()の\
      数に関わらず重複しない。record-verdict.tsの対象ACループがAC-ID単位で1回だけ判定する既存実装に合わせる）。有効なカバーとし\
      ては計上されない"
    priority: must
    verify: test
    status: pass
    attempts: 0
    verified_at: 2026-09-18
    note: test.describe.skip /
      test.describe.fixmeの両方で、直下test()にskip修飾が無くてもskipped.has=true かつ
      active.has=falseを確認。SKIPPED_TESTはtrace-matrix.ts側でAC-ID単位ループ(scripts/trace-matrix.ts:222-240)かつSet集合ベースのため、test()の件数に関わらず1回しか出力されない構造になっている。
    evidence: tests/playwright-support.test.ts:40-64 (node --test pass)
  - id: AC-031
    kind: functional
    given: "test.fixme(\"AC-031: ...\", async ({ page }) => {...})
      のように、test.fixmeで書かれたテストが存在する状態で"
    when: "trace-matrix.tsを実行する"
    then: "このタイトルはSKIPPED_TESTとして出力される（現状のように正規表現に一致せず完全に無視され、UNCOVERED_ACにすらならないので\
      はなく）"
    priority: must
    verify: test
    status: pass
    attempts: 0
    verified_at: 2026-09-18
    note: "test.fixme('AC-031:
      ...')が従来のTEST_CALL_REでは一致せず不可視化されていたのに対し、拡張後のPW_TEST_CALL_RE(scripts/lib/\
      playwright-detect.ts:24-25)はfixmeをmodifierとして認識しskipped扱いにすることをextractPla\
      ywrightCoverage経由で確認。skipped.has('AC-031')=true,
      active.has=falseの両方を検証済み。"
    evidence: tests/playwright-support.test.ts:66-71 (node --test pass)
  - id: AC-032
    kind: functional
    given: "@playwright/testをimportしていない.spec.tsファイル(例:
      Jest/Mocha)で、describeタイトルにAC-IDが書かれているが対応するit()/test()のタイトルには書かれていない状態で"
    when: "trace-matrix.tsを実行する"
    then: "従来通りdescribeタイトルはカバーとして数えられず、UNCOVERED_ACとして出力され続ける（@playwright/testをimp\
      ortしないファイルの既存挙動に影響を与えない）"
    priority: must
    verify: test
    status: pass
    attempts: 0
    verified_at: 2026-09-18
    note: "@playwright/testをimportしないファイルにdescribeタイトルのみAC-IDがある一時リポジトリを作り、trace-ma\
      trix.ts
      --jsonを実サブプロセスとして実行してcoverage['AC-001']が空配列であることを確認。isPlaywrightFile()による\
      ゲーティング(scripts/trace-matrix.ts:179)が正しく機能し、非Playwrightファイルは従来のTEST_CALL_R\
      Eのみで判定されることをエンドツーエンドで検証。"
    evidence: tests/playwright-support.test.ts:107-155 (node --test pass,
      実際にtrace-matrix.tsをCLI実行)
  - id: AC-033
    kind: functional
    given: "test.describe(\"AC-033: ...\", () => {})
      のように、AC-IDを含むdescribeタイトルの配下が空の（test()を1件も持たない）状態で"
    when: "trace-matrix.tsを実行する"
    then: "AC-033はカバーとして計上されず、UNCOVERED_ACとして出力される"
    priority: should
    verify: test
    status: pass
    attempts: 0
    verified_at: 2026-09-18
    note: "配下にtest()が1件も無いtest.describe('AC-033: ...', () =>
      {})に対し、AS-020のhasActiveChild判定(scripts/lib/playwright-detect.ts:83-90)により\
      active/skipped両方に入らないことを確認。coverageに計上されないためAC-033はUNCOVERED_ACとして出力され続ける\
