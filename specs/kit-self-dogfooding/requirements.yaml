# FEAT-008 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-008
title: "conformance-kit本体（scripts/・install.mjs）をキット自身の検査対象にする"
status: draft # draft -> (spec-lint --gate freeze) -> frozen

# 誰のどの困りごとを解くのか。1文。実装判断に迷った時の最終的な拠り所になる。
intent: "conformance-kitのメンテナが、キット本体（scripts/配下のTypeScriptとinstall.mjs）を変更した時にも、利用者に課している規約（@covers\
  必須・@assumptionと要件の相互参照・存在しないAC参照の検出）が自分自身に効くようにする。現状のconformance.config.jsonのsrcDirsはsrc・\
  testsのみで、このリポジトリにsrc/は存在しない。そのためキット本体への変更はUNSCANNED_CHANGE警告止まりで、scripts/に書かれた@assumption\
  も読まれず（record-trend.tsの@assumption AS-024がASSUMPTION_UNANCHOREDと誤報される）、確定済みなのに残った@assumptionタグ（AS-005、AS-014）\
  も検出されていない。FEAT-002のout_of_scopeで『別機能として扱う』とされたドッグフーディングを本機能として実施する。これに伴いFEAT-002のAS-002\
  （srcDirsは変更しない）は本機能の範囲では上書きされる。"

# 過剰実装を止める外周。draft を抜けるには最低1件必要。
# 「やらないと決めたこと」であって「将来やること」ではない。
out_of_scope:
  - "逆方向トレースの関数単位化。ファイル単位の@coversのままとする（README『既知の限界』の既存方針）"
  - ".claude/配下のプロンプト定義（*.md）と.github/workflows/*.ymlのトレース対象化。codeExtensionsは変更しない"
  - "examples/with-samples/をリポジトリ本体のsrcDirsに入れること。意図的な違反を含むサンプルであり、FEAT-002の分離方針を維持する"
  - "spec-lint.ts・trace-matrix.tsの既存の検査コード（UNTRACED_CHANGE・DANGLING_AC・AMBIGUOUS_TERMを含む全検査コードの判定基準・重み）の変更"
  - "spec-lint.ts・spec-init.ts・record-verdict.tsの全挙動の網羅的な遡及仕様化。@coversの根拠となる中核挙動のみをACにする"
  - "他specの仮決め（AS-019〜AS-029）の確定・期限延長。各specのオーナーが判断する"
  - "導入済みの外部ターゲットリポジトリのconformance.config.jsonの移行"

# 確信が持てないまま進める判断。コード側に @assumption AS-XXX を残して回収可能にする。
# owner と resolve_by が無い仮決めは、誰も確定させないまま本番に入る。
assumptions:
  - id: AS-030
    statement: "install.mjsはリポジトリ直下の単一ファイルでありディレクトリではないため、trace-matrix.tsのsrcDirsのエントリにファイルパスを許す。\
      エントリがファイルならそのファイル1件を、ディレクトリなら従来通り再帰的に走査する。install.mjsをscripts/へ移動する案は、READMEと導入手順の\
      `node install.mjs` を壊すため採らない"
    status: confirmed
    owner: kohei-dev
    resolve_by: "2026-10-08"
  - id: AS-031
    statement: "install.mjsは現在キット自身のconformance.config.jsonをそのまま導入先へコピーしている。本機能でsrcDirsにscripts/install.mjsを加えると、\
      導入先で配布済みscripts/のキット用@coversがDANGLING_ACになる。これを避けるため、配布用の設定をtemplates/conformance.config.json\
      として分離し（内容は変更前のconformance.config.jsonと同一）、install.mjsはこちらをコピーする"
    status: confirmed
    owner: kohei-dev
    resolve_by: "2026-10-08"
  - id: AS-032
    statement: "@coversを持たないキット本体のファイル（spec-lint.ts、spec-init.ts、record-verdict.ts）のために、本specに遡及的な受入基準を\
      各ファイル1〜2件だけ起こして@coversの根拠にする。対象は各スクリプトの存在理由である中核挙動（freezeゲートでの昇格、FEAT採番と上書き拒否、\
      証拠なきpassの拒否と2回失敗時の自動blocked化）に限る"
    status: confirmed
    owner: kohei-dev
    resolve_by: "2026-10-08"
  - id: AS-033
    statement: "spec-init.tsのテンプレートにある例示コメント『コード側に @assumption AS-001 を残して』は、キット本体を走査すると実在のAS-001への\
      参照として誤検出される（STALE_ASSUMPTION_TAG）。例示文言を `@assumption AS-XXX` に言い換える。生成されるrequirements.yamlのコメント\
      文言が変わるだけで、YAMLとしての内容は変わらない"
    status: assumed
    owner: kohei-dev
    resolve_by: "2026-10-08"

# 人間の判断が要る未決事項。frozen にするには空にする（確定させるか assumptions へ降格）。
open_questions: []

# 受入基準。ハッピーパスだけ書くと必ず後で破綻するので、異常系を必ず1件以上入れる。
# then には外から観測できる結果を書く（返す/表示/保存/拒否…）。「対応する」「できる」は不可。
acceptance:
  - id: AC-044
    kind: functional
    given: "srcDirsに実在するファイルパス（例: \"install.mjs\"）を含むconformance.config.jsonと、そのファイル内に要件に存在しない\
      `@assumption AS-777` が書かれた一時ディレクトリで"
    when: "`npx tsx scripts/trace-matrix.ts --root <tmp> --json` を実行する"
    then: "JSON出力のfindingsに code UNRECORDED_ASSUMPTION・ref AS-777 の項目を含む"
    priority: must
    verify: test
    status: pending
    attempts: 0
  - id: AC-045
    kind: functional
    given: "srcDirsに存在しないパス（例: \"no-such-dir\"）と、違反の無いsrcディレクトリを含むconformance.config.jsonの一時ディレクトリで"
    when: "`npx tsx scripts/trace-matrix.ts --root <tmp>` を実行する"
    then: "実行エラー（exit 2）にならず、exit codeが0を返す"
    priority: must
    verify: test
    status: pending
    attempts: 0
  - id: AC-046
    kind: functional
    given: "このリポジトリのルートのconformance.config.jsonで"
    when: "srcDirsを読む"
    then: "srcDirsに \"scripts\" と \"install.mjs\" を含む"
    priority: must
    verify: test
    status: pending
    attempts: 0
  - id: AC-047
    kind: functional
    given: "このリポジトリのルートで"
    when: "`npx tsx scripts/trace-matrix.ts --json` を実行する"
    then: "JSON出力のfindingsに、codeがSTALE_ASSUMPTION_TAG・DANGLING_AC・UNRECORDED_ASSUMPTIONのいずれかである項目を含まない"
    priority: must
    verify: test
    status: pending
    attempts: 0
  - id: AC-048
    kind: functional
    given: "scripts/配下（scripts/lib/を含む）のすべての.tsファイルとinstall.mjsについて"
    when: "各ファイルの本文を読む"
    then: "すべてのファイルに `@covers AC-` で始まる記述が1件以上含まれる"
    priority: must
    verify: test
    status: pending
    attempts: 0
  - id: AC-049
    kind: functional
    given: "srcDirsに \"scripts\" と \"install.mjs\" を含む設定を持つキットのリポジトリから、空の一時ディレクトリを対象に"
    when: "`node install.mjs <tmp-target>` を実行する"
    then: "<tmp-target>/conformance.config.jsonのsrcDirsが [\"src\", \"tests\"] と一致する"
    priority: must
    verify: test
    status: pending
    attempts: 0
  - id: AC-050
    kind: functional
    given: "status: draftで、thenにspec-lint.tsの曖昧語辞書（AMBIGUOUS）に載っている語を1つ含むACを持つrequirements.yamlの一時ディレクトリで"
    when: "`npx tsx scripts/spec-lint.ts <dir> --gate freeze` を実行する"
    then: "AMBIGUOUS_TERMがerror（✗）として出力され、exit code 1を返す"
    priority: must
    verify: test
    status: pending
    attempts: 0
  - id: AC-051
    kind: functional
    given: "specs/配下に id: FEAT-003 のrequirements.yamlだけが存在する一時ディレクトリで"
    when: "`npx tsx scripts/spec-init.ts new-feature --title \"x\"` を実行する"
    then: "specs/new-feature/requirements.yamlが作成され、その id が FEAT-004、status が draft と一致する"
    priority: must
    verify: test
    status: pending
    attempts: 0
  - id: AC-052
    kind: functional
    given: "specs/existing/requirements.yamlが既に存在する一時ディレクトリで"
    when: "`npx tsx scripts/spec-init.ts existing` を実行する"
    then: "exit code 2を返し、既存のrequirements.yamlの内容は変わらない"
    priority: must
    verify: test
    status: pending
    attempts: 0
  - id: AC-053
    kind: functional
    given: "AC-900（status: pending）を持つrequirements.yamlの一時ディレクトリで"
    when: "`npx tsx scripts/record-verdict.ts --ac AC-900 --verdict pass` を --evidence なしで実行する"
    then: "exit code 2を返し、requirements.yamlの内容は変わらない"
    priority: must
    verify: test
    status: pending
    attempts: 0
  - id: AC-054
    kind: functional
    given: "AC-900（attempts: 0）を持つrequirements.yamlの一時ディレクトリで"
    when: "`record-verdict.ts --ac AC-900 --verdict fail --note ...` を2回実行する"
    then: "2回目はexit code 1を返す。requirements.yamlのAC-900はstatus: blockedに更新され、open_questionsに from: AC-900・status: open の項目を1件含む"
    priority: must
    verify: test
    status: pending
    attempts: 0
