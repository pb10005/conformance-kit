# FEAT-008 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
#
# 埋め方: 人間に質問する前に、AIが全項目を推測で埋め切ること。
# 人間の仕事は白紙を埋めることではなく、埋まったものを否定・修正することにある。
# 確信が持てない箇所は open_questions か assumptions に置き、空欄で残さない。
id: FEAT-008
title: "conformance-kit本体（scripts/・install.mjs）をキット自身の検査対象にする"
status: frozen # draft -> (spec-lint --gate freeze) -> frozen

# 誰のどの困りごとを解くのか。1文。実装判断に迷った時の最終的な拠り所になる。
intent: "conformance-kitのメンテナが、キット本体（scripts/配下のTypeScriptとinstall.mjs）を変更した時にも\
  、利用者に課している規約（@covers必須・@assumptionと要件の相互参照・存在しないAC参照の検出）が自分自身に効くようにする。現状のconf\
  ormance.config.jsonのsrcDirsはsrc・testsのみで、このリポジトリにsrc/は存在しない。そのためキット本体への変更はUNS\
  CANNED_CHANGE警告止まりで、scripts/に書かれた@assumptionも読まれず（record-trend.tsの@assumption
  AS-024がASSUMPTION_UNANCHOREDと誤報される）、確定済みなのに残った@assumptionタグ（AS-005、AS-014）も検出\
  されていない。FEAT-002のout_of_scopeで『別機能として扱う』とされたドッグフーディングを本機能として実施する。これに伴いFEAT-002\
  のAS-002（srcDirsは変更しない）は本機能の範囲では上書きされる。"

# 過剰実装を止める外周。draft を抜けるには最低1件必要。
# 「やらないと決めたこと」であって「将来やること」ではない。
out_of_scope:
  - "逆方向トレースの関数単位化。ファイル単位の@coversのままとする（README『既知の限界』の既存方針）"
  - ".claude/配下のプロンプト定義（*.md）と.github/workflows/*.ymlのトレース対象化。codeExtensionsは変更\
    しない"
  - "examples/with-samples/をリポジトリ本体のsrcDirsに入れること。意図的な違反を含むサンプルであり、FEAT-002の分離方\
    針を維持する"
  - "spec-lint.ts・trace-matrix.tsの既存の検査コードの判定条件・level・重みの変更。ただしsrcDirsのエントリ解釈の拡\
    張（AS-030）で走査対象が増え、結果としてfindingsが増減することは変更に含めない。新しい検査コードは追加しない（存在しないsrcDirsエ\
    ントリは従来通り黙ってスキップする）"
  - "srcDirsのエントリがrootの外を指す場合（`..` を含むパス・絶対パス）の扱い"
  - "spec-lint.ts・spec-init.ts・record-verdict.tsの全挙動の網羅的な遡及仕様化。@coversの根拠となる中核挙\
    動のみをACにする"
  - "他specの仮決め（AS-019〜AS-029）の確定・期限延長。各specのオーナーが判断する"
  - "導入済みの外部ターゲットリポジトリのconformance.config.jsonの移行"

# 確信が持てないまま進める判断。コード側に @assumption AS-XXX を残して回収可能にする。
# owner と resolve_by が無い仮決めは、誰も確定させないまま本番に入る。
assumptions:
  - id: AS-030
    statement: "install.mjsはリポジトリ直下の単一ファイルでありディレクトリではないため、trace-matrix.tsのsrcDirsのエ\
      ントリにファイルパスを許す。エントリがファイルならそのファイル1件を、ディレクトリなら従来通り再帰的に走査する。install.mjsをscrip\
      ts/へ移動する案は、READMEと導入手順の`node install.mjs`
      を壊すため採らない。走査対象はrootからの相対POSIXパスで重複を除き、同じファイルは1回だけ数える（\"scripts\"
      と\"scripts/lib\" のように重なるエントリを許す）。codeExtensions外のファイルを指すエントリは黙って無視する"
    status: confirmed
    owner: kohei-dev
    resolve_by: "2026-10-08"
  - id: AS-031
    statement: "install.mjsは現在キット自身のconformance.config.jsonをそのまま導入先へコピーしている。本機能でsrc\
      Dirsにscripts/install.mjsを加えると、導入先で配布済みscripts/のキット用@coversがDANGLING_ACになる\
      。これを避けるため、配布用の設定をtemplates/conformance.config.jsonとして分離し（内容は変更前のconforman\
      ce.config.jsonと同一）、install.mjsはこちらをコピーする"
    status: confirmed
    owner: kohei-dev
    resolve_by: "2026-10-08"
  - id: AS-032
    statement: "@coversを持たないキット本体のファイル（spec-lint.ts、spec-init.ts、record-verdict.ts）\
      のために、本specに遡及的な受入基準を各ファイル1〜2件だけ起こして@coversの根拠にする。対象は各スクリプトの存在理由である中核挙動（fr\
      eezeゲートでの昇格、FEAT採番と上書き拒否、証拠なきpassの拒否と2回失敗時の自動blocked化）に限る"
    status: confirmed
    owner: kohei-dev
    resolve_by: "2026-10-08"
  - id: AS-033
    statement: "spec-init.tsのテンプレートにある例示コメント『コード側に @assumption AS-001
      を残して』は、キット本体を走査すると実在のAS-001への参照として誤検出される（STALE_ASSUMPTION_TAG）。例示文言を
      `@assumption AS-XXX`
      に言い換える。生成されるrequirements.yamlのコメント文言が変わるだけで、YAMLとしての内容は変わらない"
    status: assumed
    owner: kohei-dev
    resolve_by: "2026-10-08"

  - id: AS-034
    statement: "実在しないAC-ID /
      AS-IDを含むテスト用フィクスチャは、tests/のソースにその文字列がそのまま現れないように組み立てる（例:`\"AS-\" +
      \"777\"`）。tests/はsrcDirsに含まれるため、そのまま書くとリポジトリ自身のトレースでDANGLING_AC・UNRECORDE\
      D_ASSUMPTIONが出る"
    status: assumed
    owner: kohei-dev
    resolve_by: "2026-10-08"

# 人間の判断が要る未決事項。frozen にするには空にする（確定させるか assumptions へ降格）。
open_questions: []

